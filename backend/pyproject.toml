[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclotorsion"
version = "0.1.0"
description = "CyclotorsionCheck backend — toric IOL alignment verification."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
prod = [
    "google-genai>=1.0",
    "google-cloud-bigquery>=3.0",
    "firebase-admin>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pip-tools>=7.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cyclotorsion*"]

[tool.bandit]
# Only field parts of the package; ignore the intentionally broad exception
# handlers used for best-effort cloud integrations (they are reviewed, not
# accidental). B404 (no subprocess uses here) is a no-op.
exclude_dirs = ["tests", "scripts", "*.egg-info"]
skips = ["B404", "B603"]

